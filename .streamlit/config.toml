[theme]
base = "light"
primaryColor = "#0D47A1"
backgroundColor = "#E0F7FA"
secondaryBackgroundColor = "#CCF1F6"
textColor = "#0B2545"
font = "sans serif"

[client]
toolbarMode = "minimal"
# Visitors see a short message instead of a Python traceback; full errors stay in the Streamlit Cloud logs.
showErrorDetails = "none"

[server]
maxUploadSize = 5
